services:
  sol:
    build: .
    environment:
      NUXT_APP_BASE_URL: /översättarlexikon/
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/%C3%B6vers%C3%A4ttarlexikon/favicon/favicon-32x32.png').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  playwright:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /tests
    volumes:
      - .:/tests
      - playwright-dependencies:/tests/node_modules
    command: sh -c 'corepack enable && pnpm install --frozen-lockfile && pnpm test'
    environment:
      PLAYWRIGHT_BASE_URL: http://sol:3000/%C3%B6vers%C3%A4ttarlexikon/
    depends_on:
      sol:
        condition: service_healthy
volumes:
  playwright-dependencies:
